name: Daily Literature Digest to Notion

on:
  schedule:
    - cron: '30 0 * * *'  # 每天 UTC 时间 00:30（北京时间 08:30）
  workflow_dispatch:     # 支持手动运行

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests feedparser biopython arxiv

      - name: Run main.py (arXiv + bioRxiv + medRxiv + PubMed)
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_PAGE_ID: ${{ secrets.NOTION_PAGE_ID }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY || '' }}  # 如你有用 DeepSeek，可加上
        run: python main.py
